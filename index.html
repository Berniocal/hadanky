<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hádanky & wow — fyzika a matematika</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe2ea;--accent:#3157d5;--accent-soft:#eef2ff;--good:#eaf8ef;--good-text:#17663a;--shadow:0 10px 30px rgba(15,23,42,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171d2b;--text:#eef2ff;--muted:#a8b3c7;--line:#303a4d;--accent:#9bb2ff;--accent-soft:#222c49;--good:#163525;--good-text:#a8ebbe;--shadow:none}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.62}.wrap{width:min(980px,calc(100% - 28px));margin:0 auto}header{padding:44px 0 24px}h1{margin:0 0 6px;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;letter-spacing:-.04em}header p{margin:0;color:var(--muted);font-size:1.05rem}main{display:grid;gap:22px;padding:8px 0 54px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.82rem;font-weight:750;margin-bottom:10px}h2{margin:0 0 14px;font-size:clamp(1.45rem,3vw,2rem);line-height:1.2}h3{margin-top:28px;margin-bottom:8px}.lead{font-size:1.08rem}.question{margin:22px 0;padding:16px 18px;border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:12px;font-weight:700;font-size:1.1rem}.formula{overflow-x:auto;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--card) 82%,var(--accent-soft));text-align:center}details{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden}summary{cursor:pointer;padding:15px 18px;font-weight:800;color:var(--accent);background:var(--accent-soft);user-select:none}.solution{padding:4px 18px 20px}.step{margin:14px 0;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--card) 90%,var(--accent-soft))}.step h4{margin:0 0 7px;font-size:1rem;color:var(--accent)}.wow{margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--good);color:var(--good-text);font-weight:700}.table-wrap{overflow-x:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.86rem;color:var(--muted)}.note,.sources{color:var(--muted);font-size:.94rem}.sources{margin-top:24px}.sources a{color:var(--accent)}footer{color:var(--muted);padding:0 0 34px;font-size:.9rem}
/* MOBILE-FRIENDLY v1 */
html{-webkit-text-size-adjust:100%}img,svg{max-width:100%;height:auto}p,li,.question,.note,.sources{overflow-wrap:anywhere}summary{min-height:48px;display:flex;align-items:center;touch-action:manipulation}.formula,.table-wrap{-webkit-overflow-scrolling:touch;scrollbar-width:thin}mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
@media(max-width:640px){.wrap{width:min(100% - 16px,980px)}header{padding:24px 4px 16px}h1{font-size:clamp(1.9rem,9vw,2.55rem);line-height:1.08;letter-spacing:-.03em}header p{font-size:.98rem;line-height:1.45}main{gap:14px;padding:4px 0 32px}.card{border-radius:16px;padding:16px 14px}.tag{font-size:.78rem;margin-bottom:8px}h2{font-size:clamp(1.28rem,6.2vw,1.65rem);line-height:1.22;margin-bottom:10px}h3{font-size:1.12rem;margin-top:22px}.lead{font-size:1rem}.question{margin:16px 0;padding:13px;border-left-width:4px;border-radius:10px;font-size:1rem}details{margin-top:14px;border-radius:12px}summary{padding:13px 14px;font-size:1rem}.solution{padding:2px 12px 14px}.step{margin:12px 0;padding:12px;border-radius:11px}.step h4{font-size:.98rem}.formula{margin-left:-2px;margin-right:-2px;padding:10px 8px;border-radius:10px;text-align:left}.wow{margin-top:16px;padding:12px 13px;border-radius:10px}.table-wrap{margin-left:-2px;margin-right:-2px}table{min-width:520px;font-size:.92rem}th,td{padding:9px 10px}.note,.sources{font-size:.9rem}.sources a{word-break:break-word}footer{padding:0 4px 24px}}
@media(max-width:380px){.wrap{width:calc(100% - 10px)}.card{padding:14px 11px;border-radius:14px}.solution{padding-left:9px;padding-right:9px}.step{padding:10px}.question{padding:11px 10px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Hádanky & wow</h1><p>Krátké matematické a fyzikální problémy, které vypadají jinak, než dopadnou.</p></header>
<main id="hadanky"><!-- HÁDANKY:ZAČÁTEK --><!-- HÁDANKY:KONEC --></main>
<footer>Nové hádanky se budou postupně přidávat sem.</footer>
</div>
<script defer src="hadanky-loader.js"></script>
</body>
</html>
